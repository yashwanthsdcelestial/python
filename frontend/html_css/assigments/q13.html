<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Pricing Table</title>

<style>
:root {
    --color-bg: #f5f5f5;
    --color-surface: #ffffff;
    --color-primary: #4f46e5;
    --color-primary-hover: #4338ca;
    --color-text: #222;
    --color-muted: #777;
    --color-border: #ddd;
    --color-success: #16a34a;
    --color-danger: #dc2626;
    --shadow: 0 4px 10px rgba(0,0,0,0.1);

    --spacing-sm: 8px;
    --spacing-md: 16px;
    --spacing-lg: 24px;

    --radius: 10px;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
}

.container {
    padding: var(--spacing-lg);
}

.pricing {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
}

.card {
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: var(--spacing-lg);
    box-shadow: var(--shadow);
    border: 1px solid var(--color-border);
    text-align: center;
    position: relative;
    transition: transform 0.3s;
}

.title {
    font-size: 20px;
    margin-bottom: var(--spacing-sm);
}

.price {
    font-size: clamp(24px, 5vw, 40px);
    margin-bottom: var(--spacing-md);
}

.features {
    list-style: none;
    padding: 0;
    margin-bottom: var(--spacing-md);
    text-align: left;
}

.features li {
    margin-bottom: var(--spacing-sm);
    padding-left: 20px;
    position: relative;
}

.features li.included::before {
    content: "✓";
    position: absolute;
    left: 0;
    color: var(--color-success);
}

.features li.excluded::before {
    content: "✗";
    position: absolute;
    left: 0;
    color: var(--color-danger);
}

.btn {
    background: var(--color-primary);
    color: white;
    border: none;
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.3s;
}

.btn:hover {
    background: var(--color-primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.pro {
    background: #eef2ff;
}

.pro::before {
    content: "Popular";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-primary);
    color: white;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: var(--radius);
}

@media (min-width: 768px) {
    .pricing {
        flex-direction: row;
    }

    .card {
        flex: 1;
    }

    .pro {
        transform: translateY(-10px);
    }
}

@media (min-width: 1024px) {
    .pro {
        transform: scale(1.1);
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="pricing">

        <div class="card">
            <div class="title">Basic</div>
            <div class="price">$10/mo</div>
            <ul class="features">
                <li class="included">Feature A</li>
                <li class="included">Feature B</li>
                <li class="excluded">Feature C</li>
                <li class="excluded">Feature D</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>

        <div class="card pro">
            <div class="title">Pro</div>
            <div class="price">$25/mo</div>
            <ul class="features">
                <li class="included">Feature A</li>
                <li class="included">Feature B</li>
                <li class="included">Feature C</li>
                <li class="excluded">Feature D</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>

        <div class="card">
            <div class="title">Enterprise</div>
            <div class="price">$50/mo</div>
            <ul class="features">
                <li class="included">Feature A</li>
                <li class="included">Feature B</li>
                <li class="included">Feature C</li>
                <li class="included">Feature D</li>
            </ul>
            <button class="btn">Choose Plan</button>
        </div>

    </div>
</div>

</body>
</html>
