<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Responsive Gallery</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }

    .card {
        border-radius: 10px;
        overflow: hidden;
        aspect-ratio: 1 / 1;
        transition: transform 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .card:nth-child(1) { background: #ff6b6b; }
    .card:nth-child(2) { background: #6bcB77; }
    .card:nth-child(3) { background: #4d96ff; }
    .card:nth-child(4) { background: #f7b801; }
    .card:nth-child(5) { background: #9d4edd; }
    .card:nth-child(6) { background: #ff924c; }
    .card:nth-child(7) { background: #00bcd4; }
    .card:nth-child(8) { background: #cdb4db; }
    .card:nth-child(9) { background: #90dbf4; }
    .card:nth-child(10) { background: #b5e48c; }
    .card:nth-child(11) { background: #ffafcc; }
    .card:nth-child(12) { background: #ffd166; }

    .wide {
        grid-column: span 2;
    }

    .tall {
        grid-row: span 2;
    }
</style>
</head>

<body>

<div class="gallery">
    <div class="card wide"></div>
    <div class="card"></div>
    <div class="card tall"></div>
    <div class="card"></div>
    <div class="card wide"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
</div>

</body>
</html>
