<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard Grid Layout</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 250px 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
            "header header"
            "sidebar main"
            "footer footer";
    }

    header {
        grid-area: header;
        background: #4CAF50;
        color: white;
        padding: 20px;
        text-align: center;
    }

    aside {
        grid-area: sidebar;
        background: #2196F3;
        color: white;
        padding: 20px;
    }

    main {
        grid-area: main;
        background: #f4f4f4;
        padding: 20px;
    }

    footer {
        grid-area: footer;
        background: #333;
        color: white;
        padding: 15px;
        text-align: center;
    }

    @media (max-width: 768px) {
        .container {
            grid-template-columns: 1fr;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas:
                "header"
                "sidebar"
                "main"
                "footer";
        }
    }
</style>
</head>

<body>

<div class="container">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Main Content</main>
    <footer>Footer</footer>
</div>

</body>
</html>
