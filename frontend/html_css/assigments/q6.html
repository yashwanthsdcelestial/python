<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Positioning Playground</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        line-height: 1.6;
    }

    nav {
        position: sticky;
        top: 0;
        background: #333;
        color: white;
        padding: 15px;
        z-index: 1000;
    }

    .container {
        padding: 20px;
    }

    .card {
        position: relative;
        width: 250px;
        padding: 20px;
        border: 1px solid #ccc;
        margin-bottom: 40px;
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: red;
        color: white;
        padding: 5px 10px;
        font-size: 12px;
    }

    .info-container {
        position: relative;
        display: inline-block;
        margin-top: 20px;
    }

    .info-icon {
        background: #007BFF;
        color: white;
        border-radius: 50%;
        padding: 5px 10px;
        cursor: pointer;
    }

    .tooltip {
        position: absolute;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        background: black;
        color: white;
        padding: 5px 10px;
        white-space: nowrap;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
    }

    .info-container:hover .tooltip {
        visibility: visible;
        opacity: 1;
    }

    .back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #28a745;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        text-decoration: none;
        z-index: 999;
    }

    .section {
        height: 100vh;
        padding: 20px;
    }

    .section:nth-child(even) {
        background: #f4f4f4;
    }
</style>
</head>

<body>

<nav>
    Sticky Navigation Bar
</nav>

<div class="container">

    <div class="card">
        Product Card
        <div class="badge">SALE</div>

        <div class="info-container">
            <span class="info-icon">i</span>
            <div class="tooltip">More product info</div>
        </div>
    </div>

</div>

<div class="section">Scrollable Content Section 1</div>
<div class="section">Scrollable Content Section 2</div>
<div class="section">Scrollable Content Section 3</div>

<a href="#" class="back-to-top">Top</a>

</body>
</html>
