<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Navbar</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .nav-links {
            flex-direction: column;
            align-items: center;
        }

        .signup {
            align-self: center;
        }
    }
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        padding: 15px 20px;
        background: #333;
        color: white;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        position: relative;
        transition: color 0.3s;
    }

    .nav-links a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 0;
        height: 2px;
        background: white;
        transition: width 0.3s;
    }

    .nav-links a:hover {
        color: #00d4ff;
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    .signup {
        background: #00d4ff;
        color: black;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
    }

   
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">Logo</div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
    </div>

    <a href="#" class="signup">Sign Up</a>
</nav>

</body>
</html>
