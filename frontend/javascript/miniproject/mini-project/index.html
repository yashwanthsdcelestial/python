<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <style>
    /* ── CSS variables — light & dark ─────────────────────── */
    :root {
      --bg-page:      #f0f4f8;
      --bg-card:      #ffffff;
      --bg-sidebar:   #ffffff;
      --text-primary: #111827;
      --text-muted:   #6b7280;
      --border:       #e5e7eb;
      --accent:       #2563eb;
      --accent-hover: #1d4ed8;
      --shadow:       0 2px 12px rgba(0,0,0,.07);
    }
    [data-theme="dark"] {
      --bg-page:      #0f172a;
      --bg-card:      #1e293b;
      --bg-sidebar:   #1e293b;
      --text-primary: #f1f5f9;
      --text-muted:   #94a3b8;
      --border:       #334155;
      --accent:       #3b82f6;
      --accent-hover: #2563eb;
      --shadow:       0 2px 12px rgba(0,0,0,.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page); color: var(--text-primary);
      min-height: 100vh; transition: background .25s, color .25s;
    }

    /* ── Layout ──────────────────────────────────────────── */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; flex-shrink: 0; background: var(--bg-sidebar);
      border-right: 1px solid var(--border); padding: 1.25rem;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .sidebar h1 { font-size: 18px; font-weight: 700; }
    .sidebar .tagline { font-size: 12px; color: var(--text-muted); }
    .sidebar hr { border: none; border-top: 1px solid var(--border); }
    .fav-header { display: flex; align-items: center; gap: 6px; }
    .fav-header h2 { font-size: 14px; font-weight: 600; }
    #fav-count { font-size: 12px; color: var(--text-muted); }
    #fav-list { list-style: none; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .fav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 7px; cursor: pointer;
      border: 1px solid transparent; transition: background .15s;
    }
    .fav-item:hover { background: var(--bg-page); border-color: var(--border); }
    .fav-item:focus-visible { outline: 2px solid var(--accent); }
    .fav-name { font-size: 13px; font-weight: 500; }
    .fav-remove {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 16px; padding: 0 3px; border-radius: 3px; line-height: 1;
    }
    .fav-remove:hover { color: #dc2626; }
    .fav-empty { font-size: 13px; color: var(--text-muted); padding: 4px; }
    #theme-toggle {
      padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg-page); color: var(--text-primary); cursor: pointer;
      font-size: 13px; width: 100%;
    }
    #theme-toggle:hover { border-color: var(--accent); }

    /* ── Main content ─────────────────────────────────────── */
    .main { flex: 1; padding: 2rem; max-width: 900px; }
    .search-area { margin-bottom: 1.75rem; }
    .search-bar { display: flex; gap: 8px; }
    #search-input {
      flex: 1; padding: 11px 16px; border: 2px solid var(--border);
      border-radius: 10px; font-size: 15px; outline: none;
      background: var(--bg-card); color: var(--text-primary);
      transition: border-color .2s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input.invalid { border-color: #dc2626; }
    #search-btn {
      padding: 11px 22px; border: none; border-radius: 10px;
      background: var(--accent); color: white; cursor: pointer; font-size: 15px;
      transition: background .15s;
    }
    #search-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #search-btn:disabled { opacity: .6; cursor: not-allowed; }
    #search-error { font-size: 12px; color: #dc2626; margin-top: 4px; min-height: 16px; }

    /* ── Weather Card ─────────────────────────────────────── */
    .weather-card {
      background: var(--bg-card); border-radius: 16px;
      border: 1px solid var(--border); padding: 1.5rem;
      box-shadow: var(--shadow); animation: fadeUp .35s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .card-city { font-size: 24px; font-weight: 700; }
    .fav-btn {
      background: none; border: none; font-size: 24px; cursor: pointer;
      color: #9ca3af; transition: color .15s, transform .15s; padding: 0 4px;
    }
    .fav-btn:hover, .fav-btn.faved { color: #f59e0b; transform: scale(1.15); }
    .card-tz { font-size: 12px; color: var(--text-muted); margin-bottom: 1.25rem; }

    .card-main { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .weather-emoji { font-size: 64px; line-height: 1; }
    .card-temp { font-size: 52px; font-weight: 700; display: block; line-height: 1; }
    .card-desc { font-size: 16px; color: var(--text-muted); display: block; }

    .card-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat-item {
      background: var(--bg-page); border-radius: 8px; padding: .65rem .9rem;
      display: flex; flex-direction: column; gap: 2px;
    }
    .stat-label { font-size: 11px; color: var(--text-muted); }
    .stat-value { font-size: 16px; font-weight: 600; }

    /* Forecast */
    .forecast-title { font-size: 14px; font-weight: 600; margin-bottom: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .forecast-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .forecast-day {
      background: var(--bg-page); border-radius: 10px; padding: .65rem .75rem;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      flex-shrink: 0; min-width: 80px; border: 1px solid var(--border);
    }
    .forecast-date { font-size: 11px; color: var(--text-muted); text-align: center; }
    .forecast-icon { font-size: 24px; }
    .forecast-temp { display: flex; gap: 6px; font-size: 13px; }
    .temp-max { font-weight: 600; }
    .temp-min { color: var(--text-muted); }

    /* Spinner */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; padding: 3rem; gap: 12px; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { font-size: 14px; color: var(--text-muted); }

    /* Error */
    .error-card { background: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px; padding: 1.25rem; text-align: center; }
    [data-theme="dark"] .error-card { background: #450a0a; border-color: #7f1d1d; }
    .error-msg { color: #dc2626; font-size: 14px; margin: .5rem 0; }
    .retry-btn { padding: 6px 16px; background: white; border: 1px solid #fca5a5; border-radius: 7px; cursor: pointer; color: #dc2626; font-size: 13px; margin-top: .5rem; }
    .retry-btn:hover { background: #fef2f2; }

    /* Responsive */
    @media (max-width: 640px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Sidebar">
      <div>
        <h1>🌤 Weather</h1>
        <p class="tagline">Real-time weather dashboard</p>
      </div>
      <hr />
      <div class="fav-header">
        <h2>Favorites</h2>
        <span id="fav-count" aria-live="polite"></span>
      </div>
      <ul id="fav-list" role="listbox" aria-label="Favorite cities"></ul>
      <hr />
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙 Dark</button>
    </aside>

    <!-- Main -->
    <main class="main" role="main">
      <div class="search-area">
        <div class="search-bar">
          <input
            id="search-input"
            type="text"
            placeholder="Search for a city…"
            autocomplete="off"
            autocapitalize="words"
            aria-label="Search for a city"
            aria-describedby="search-error"
          />
          <button id="search-btn" aria-label="Search">Search</button>
        </div>
        <div id="search-error" role="alert" aria-live="polite"></div>
      </div>

      <div id="weather-output" aria-live="polite" aria-label="Weather results"></div>
    </main>
  </div>

  <!-- ES6 module entry point -->
  <script type="module" src="app.js"></script>
</body>
</html>
