<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q7 — Fetch API CRUD</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
    h2 { margin-bottom: .5rem; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 1.5rem; }
    .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
    button {
      padding: 8px 16px; border: none; border-radius: 6px;
      background: #2563eb; color: white; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    button.get    { background: #059669; } button.get:hover { background: #047857; }
    button.post   { background: #2563eb; } button.post:hover { background: #1d4ed8; }
    button.put    { background: #d97706; } button.put:hover { background: #b45309; }
    button.delete { background: #dc2626; } button.delete:hover { background: #b91c1c; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media(max-width:640px){ .panels { grid-template-columns: 1fr; } }
    .panel { background: white; border-radius: 8px; padding: 1rem; border: 1px solid #e5e7eb; }
    .panel h3 { font-size: 14px; font-weight: 600; margin-bottom: .5rem; color: #374151; }
    pre {
      background: #1e1e1e; color: #d4d4d4; padding: .75rem; border-radius: 6px;
      font-size: 12px; overflow: auto; max-height: 300px; white-space: pre-wrap;
    }
    .req-log { font-size: 12px; color: #6b7280; margin-bottom: .5rem; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: .5rem; }
    .status.ok  { background: #dcfce7; color: #166534; }
    .status.err { background: #fee2e2; color: #991b1b; }
    .spinner { color: #2563eb; font-style: italic; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Q7 — Fetch API CRUD Operations</h2>
  <p class="subtitle">All requests hit JSONPlaceholder. fetchWithTimeout uses AbortController.</p>

  <div class="btn-grid">
    <button class="get"    onclick="run('getAllPosts')">GET all posts (limit 5)</button>
    <button class="get"    onclick="run('getPost')">GET post by ID</button>
    <button class="post"   onclick="run('createPost')">POST create post</button>
    <button class="put"    onclick="run('updatePost')">PUT update post</button>
    <button class="delete" onclick="run('deletePost')">DELETE post</button>
    <button class="get"    onclick="run('timeout')">Test timeout (1ms)</button>
  </div>

  <div class="panels">
    <div class="panel">
      <h3>Request Log</h3>
      <div id="req-log" class="req-log">No requests yet.</div>
    </div>
    <div class="panel">
      <h3>Response</h3>
      <div id="status-badge"></div>
      <pre id="response">—</pre>
    </div>
  </div>

  <script>
    const BASE = 'https://jsonplaceholder.typicode.com';

    // ── fetchWithTimeout ────────────────────────────────────────────────
    async function fetchWithTimeout(url, options = {}, timeout = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      logReq(options.method || 'GET', url);

      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);

        console.log(`[${options.method || 'GET'}] ${url} → ${res.status}`);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status} — ${res.statusText}`);
        }

        const data = await res.json();
        return { success: true, data, status: res.status };
      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') {
          throw new Error(`Request timed out after ${timeout}ms`);
        }
        throw err;
      }
    }

    // ── CRUD functions ──────────────────────────────────────────────────
    async function getAllPosts(limit = 5) {
      return fetchWithTimeout(`${BASE}/posts?_limit=${limit}`);
    }

    async function getPost(id = 1) {
      return fetchWithTimeout(`${BASE}/posts/${id}`);
    }

    async function createPost(data = { title: 'Hello World', body: 'This is a new post', userId: 1 }) {
      return fetchWithTimeout(`${BASE}/posts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
    }

    async function updatePost(id = 1, data = { title: 'Updated Title', body: 'Updated body' }) {
      return fetchWithTimeout(`${BASE}/posts/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, id, userId: 1 }),
      });
    }

    async function deletePost(id = 1) {
      return fetchWithTimeout(`${BASE}/posts/${id}`, { method: 'DELETE' });
    }

    // ── UI helpers ──────────────────────────────────────────────────────
    function logReq(method, url) {
      document.getElementById('req-log').textContent = `→ ${method} ${url}`;
      document.getElementById('response').textContent = '⏳ Loading…';
      document.getElementById('status-badge').innerHTML = '<span class="spinner">Fetching…</span>';
    }

    function showResult(result) {
      document.getElementById('status-badge').innerHTML =
        `<span class="status ok">✓ success — status ${result.status || 200}</span>`;
      document.getElementById('response').textContent =
        JSON.stringify(result.data ?? result, null, 2);
    }

    function showError(err) {
      document.getElementById('status-badge').innerHTML =
        `<span class="status err">✗ Error</span>`;
      document.getElementById('response').textContent = err.message;
    }

    // ── Demo runner ─────────────────────────────────────────────────────
    async function run(action) {
      try {
        let result;
        switch (action) {
          case 'getAllPosts': result = await getAllPosts(5); break;
          case 'getPost':    result = await getPost(1);    break;
          case 'createPost': result = await createPost();  break;
          case 'updatePost': result = await updatePost(1); break;
          case 'deletePost': result = await deletePost(1); break;
          case 'timeout':    result = await fetchWithTimeout(`${BASE}/posts/1`, {}, 1); break;
        }
        showResult(result);
      } catch (err) {
        showError(err);
      }
    }
  </script>
</body>
</html>
