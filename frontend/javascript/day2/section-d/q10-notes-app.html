<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q10 — localStorage Notes App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f3f4f6; padding: 1.5rem; }
    h2 { margin-bottom: 1.25rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; align-items: center;
    }
    .toolbar input {
      padding: 8px 12px; border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; outline: none; flex: 1; min-width: 160px;
    }
    .toolbar input:focus { border-color: #2563eb; }
    .toolbar select {
      padding: 7px 10px; border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; outline: none; background: white;
    }
    .btn { padding: 8px 14px; border: none; border-radius: 7px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #2563eb; color: white; } .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost   { background: white; border: 1px solid #d1d5db; color: #374151; }
    .btn-ghost:hover { background: #f9fafb; }
    .meta { font-size: 13px; color: #6b7280; margin-bottom: 1rem; }

    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 1rem; }
    .note-card {
      border-radius: 10px; padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      display: flex; flex-direction: column; gap: 8px;
      transition: box-shadow .15s;
    }
    .note-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.10); }
    .note-card.yellow { background: #fef9c3; }
    .note-card.blue   { background: #dbeafe; }
    .note-card.green  { background: #dcfce7; }
    .note-card.pink   { background: #fce7f3; }
    .note-card.white  { background: white; border: 1px solid #e5e7eb; }
    .note-title { font-weight: 600; font-size: 15px; color: #111827; }
    .note-content { font-size: 13px; color: #374151; flex: 1; white-space: pre-wrap; word-break: break-word; max-height: 100px; overflow: hidden; }
    .note-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #6b7280; }
    .note-actions { display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 3px 5px; border-radius: 4px; }
    .icon-btn:hover { background: rgba(0,0,0,.08); }

    /* Modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 1.5rem; width: 90%; max-width: 440px; box-shadow: 0 8px 40px rgba(0,0,0,.15); }
    .modal h3 { margin-bottom: 1rem; }
    .modal label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: .75rem; }
    .modal input, .modal textarea, .modal select {
      width: 100%; padding: 8px 11px; border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; outline: none; font-family: inherit;
    }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #2563eb; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1rem; }
    .empty { text-align: center; padding: 3rem; color: #9ca3af; }
    .toast-area { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
    .toast {
      background: #1f2937; color: white; padding: 10px 16px; border-radius: 8px;
      font-size: 13px; animation: slideIn .3s ease; max-width: 280px;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <h2>📒 Notes App</h2>

  <div class="toolbar">
    <input id="search-input" type="text" placeholder="Search notes…" oninput="render()" />
    <select id="sort-select" onchange="render()">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="alpha">A → Z</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">+ New Note</button>
    <button class="btn btn-ghost" onclick="exportNotes()">⬇ Export</button>
    <label class="btn btn-ghost" style="cursor:pointer">
      ⬆ Import
      <input type="file" accept=".json" style="display:none" onchange="importNotes(event)" />
    </label>
  </div>

  <div class="meta" id="meta"></div>
  <div class="notes-grid" id="notes-grid"></div>
  <div class="empty"    id="empty"      style="display:none">No notes yet. Create one!</div>
  <div class="toast-area" id="toast-area"></div>

  <!-- Note modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3 id="modal-title">New Note</h3>
      <label>Title</label>
      <input id="field-title" type="text" placeholder="Meeting notes…" />
      <label>Content</label>
      <textarea id="field-content" placeholder="Write something…"></textarea>
      <label>Color</label>
      <select id="field-color">
        <option value="yellow">🟡 Yellow</option>
        <option value="blue">🔵 Blue</option>
        <option value="green">🟢 Green</option>
        <option value="pink">🩷 Pink</option>
        <option value="white">⬜ White</option>
      </select>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveNote()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'js-notes-app';
    let editingId = null;

    // ── Storage helpers ───────────────────────────────────────────────
    function loadNotes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch { return []; }
    }

    function saveNotes(notes) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          showToast('⚠ Storage full! Delete some notes first.', 'error');
        }
      }
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // ── Modal helpers ─────────────────────────────────────────────────
    function openModal(id) {
      editingId = id || null;
      document.getElementById('modal-title').textContent = id ? 'Edit Note' : 'New Note';
      if (id) {
        const note = loadNotes().find(n => n.id === id);
        if (note) {
          document.getElementById('field-title').value   = note.title;
          document.getElementById('field-content').value = note.content;
          document.getElementById('field-color').value   = note.color;
        }
      } else {
        document.getElementById('field-title').value   = '';
        document.getElementById('field-content').value = '';
        document.getElementById('field-color').value   = 'yellow';
      }
      document.getElementById('modal').classList.add('open');
      document.getElementById('field-title').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      editingId = null;
    }

    // Close on backdrop click
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    // ── Save note ─────────────────────────────────────────────────────
    function saveNote() {
      const title   = document.getElementById('field-title').value.trim();
      const content = document.getElementById('field-content').value.trim();
      const color   = document.getElementById('field-color').value;

      if (!title) {
        document.getElementById('field-title').style.borderColor = '#dc2626';
        return;
      }
      document.getElementById('field-title').style.borderColor = '';

      const notes = loadNotes();
      const now   = new Date().toISOString();

      if (editingId) {
        const idx = notes.findIndex(n => n.id === editingId);
        if (idx > -1) {
          notes[idx] = { ...notes[idx], title, content, color, updatedAt: now };
        }
      } else {
        notes.push({ id: genId(), title, content, color, createdAt: now, updatedAt: now });
      }

      saveNotes(notes);
      closeModal();
      render();
      showToast(editingId ? 'Note updated ✓' : 'Note saved ✓');
    }

    // ── Delete ────────────────────────────────────────────────────────
    function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      const notes = loadNotes().filter(n => n.id !== id);
      saveNotes(notes);
      render();
      showToast('Note deleted');
    }

    // ── Export / Import ────────────────────────────────────────────────
    function exportNotes() {
      const blob = new Blob([JSON.stringify(loadNotes(), null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'notes-export.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importNotes(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');
          const existing = loadNotes();
          const merged   = [...existing, ...imported.filter(n => !existing.find(e => e.id === n.id))];
          saveNotes(merged);
          render();
          showToast(`Imported ${imported.length} note(s) ✓`);
        } catch {
          showToast('⚠ Invalid JSON file', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ── Toast ─────────────────────────────────────────────────────────
    function showToast(msg) {
      const area  = document.getElementById('toast-area');
      const toast = document.createElement('div');
      toast.className   = 'toast';
      toast.textContent = msg;
      area.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ── Render ────────────────────────────────────────────────────────
    function render() {
      const query    = document.getElementById('search-input').value.toLowerCase();
      const sortBy   = document.getElementById('sort-select').value;
      let   notes    = loadNotes();

      // Search filter
      if (query) {
        notes = notes.filter(n =>
          n.title.toLowerCase().includes(query) ||
          n.content.toLowerCase().includes(query)
        );
      }

      // Sort
      if (sortBy === 'newest') notes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      if (sortBy === 'oldest') notes.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      if (sortBy === 'alpha')  notes.sort((a, b) => a.title.localeCompare(b.title));

      const grid  = document.getElementById('notes-grid');
      const empty = document.getElementById('empty');
      const meta  = document.getElementById('meta');

      grid.innerHTML = '';
      empty.style.display = notes.length ? 'none' : 'block';

      const total    = loadNotes().length;
      const lastSave = notes[0]?.updatedAt ? new Date(notes[0].updatedAt).toLocaleString() : '—';
      meta.textContent = `${total} note(s) total — Last updated: ${lastSave}`;

      const frag = document.createDocumentFragment();
      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'note-card ' + note.color;

        const title = document.createElement('div');
        title.className   = 'note-title';
        title.textContent = note.title;

        const content = document.createElement('div');
        content.className   = 'note-content';
        content.textContent = note.content;

        const footer = document.createElement('div');
        footer.className = 'note-footer';

        const date = document.createElement('span');
        date.textContent = new Date(note.createdAt).toLocaleDateString();

        const actions = document.createElement('div');
        actions.className = 'note-actions';

        const editBtn = document.createElement('button');
        editBtn.className   = 'icon-btn';
        editBtn.textContent = '✏️';
        editBtn.title       = 'Edit';
        editBtn.addEventListener('click', () => openModal(note.id));

        const delBtn = document.createElement('button');
        delBtn.className   = 'icon-btn';
        delBtn.textContent = '🗑️';
        delBtn.title       = 'Delete';
        delBtn.addEventListener('click', () => deleteNote(note.id));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        footer.appendChild(date);
        footer.appendChild(actions);

        card.appendChild(title);
        card.appendChild(content);
        card.appendChild(footer);
        frag.appendChild(card);
      });

      grid.appendChild(frag);
    }

    // ── Init ──────────────────────────────────────────────────────────
    render();

    // Seed demo notes if empty
    if (loadNotes().length === 0) {
      const now = new Date().toISOString();
      saveNotes([
        { id: genId(), title: 'Meeting Notes', content: 'Discuss Q3 roadmap with team.', color: 'yellow', createdAt: now, updatedAt: now },
        { id: genId(), title: 'Shopping List', content: 'Eggs, milk, bread, butter.', color: 'green', createdAt: now, updatedAt: now },
        { id: genId(), title: 'Book Ideas', content: 'Start reading Clean Code.', color: 'blue', createdAt: now, updatedAt: now },
      ]);
      render();
    }
  </script>
</body>
</html>
