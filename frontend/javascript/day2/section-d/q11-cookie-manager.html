<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q11 — Cookie Manager & Session Tracker</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #f5f5f5; }
    h2 { margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width:640px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: white; border-radius: 10px; padding: 1.25rem; border: 1px solid #e5e7eb; }
    .panel h3 { margin-bottom: 1rem; font-size: 16px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    input, select {
      padding: 7px 11px; border: 1.5px solid #d1d5db; border-radius: 7px;
      font-size: 14px; outline: none; flex: 1; min-width: 80px;
    }
    input:focus, select:focus { border-color: #2563eb; }
    button {
      padding: 7px 14px; border: none; border-radius: 7px; cursor: pointer;
      font-size: 13px; background: #2563eb; color: white;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.ghost { background: white; border: 1px solid #d1d5db; color: #374151; }
    button.ghost:hover { background: #f3f4f6; }
    pre {
      background: #1e1e1e; color: #d4d4d4; padding: .75rem; border-radius: 7px;
      font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    }
    .session-card {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px;
      padding: 1rem; margin-top: .75rem;
    }
    .session-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
    .session-label { color: #6b7280; }
    .session-value { font-weight: 600; color: #1e40af; }
    .theme-btn { display: flex; gap: 8px; margin-top: .75rem; }
    .result-msg { font-size: 13px; color: #059669; margin-top: .4rem; min-height: 18px; }
  </style>
</head>
<body>
  <h2>Q11 — Cookie Manager & Session Tracker</h2>
  <div class="grid">

    <!-- Part A: Cookie Manager -->
    <div class="panel">
      <h3>Part A — CookieManager</h3>

      <p style="font-size:12px;color:#6b7280;margin-bottom:.75rem;">set / get / delete / has / getAll</p>

      <div class="form-row">
        <input id="c-name"  type="text" placeholder="name" />
        <input id="c-value" type="text" placeholder="value" />
        <input id="c-days"  type="number" placeholder="days" value="7" style="max-width:70px" />
        <button onclick="doSet()">Set</button>
      </div>
      <div class="form-row">
        <input id="c-get-name" type="text" placeholder="Cookie name to get/delete" />
        <button class="ghost" onclick="doGet()">Get</button>
        <button class="ghost" onclick="doHas()">Has?</button>
        <button class="danger" onclick="doDelete()">Delete</button>
      </div>
      <div class="form-row">
        <button class="ghost" onclick="doGetAll()">GetAll()</button>
        <button class="danger" onclick="clearAllCookies()">Clear All</button>
      </div>
      <div class="result-msg" id="c-result"></div>
      <pre id="c-output">—</pre>
    </div>

    <!-- Part B: Session Tracker -->
    <div class="panel">
      <h3>Part B — Session Tracker</h3>
      <p style="font-size:12px;color:#6b7280;margin-bottom:.75rem;">
        Tracks visit count, first/last visit, preferred theme. Refresh to see count increment!
      </p>
      <div class="session-card" id="session-card"></div>

      <div class="theme-btn">
        <button onclick="setTheme('light')">☀️ Light theme</button>
        <button onclick="setTheme('dark')">🌙 Dark theme</button>
        <button onclick="setTheme('system')">💻 System</button>
      </div>
      <div class="result-msg" id="s-result"></div>
    </div>

  </div>

  <script>
    // ══════════════════════════════════════════════════════
    //  CookieManager
    // ══════════════════════════════════════════════════════
    const CookieManager = {

      /**
       * set(name, value, options)
       * options: { expires (days), path, secure, sameSite }
       */
      set(name, value, options = {}) {
        let str = `${encodeURIComponent(name)}=${encodeURIComponent(value)}`;

        if (options.expires) {
          const d = new Date();
          d.setTime(d.getTime() + options.expires * 24 * 60 * 60 * 1000);
          str += `; expires=${d.toUTCString()}`;
        }

        str += `; path=${options.path || '/'}`;

        if (options.secure)   str += '; Secure';
        if (options.sameSite) str += `; SameSite=${options.sameSite}`;

        document.cookie = str;
        return str;
      },

      /**
       * get(name) — parse document.cookie and return value for name
       * Handles URL-encoded values and values with '=' inside
       */
      get(name) {
        const encoded = encodeURIComponent(name);
        const cookies = document.cookie.split(';');
        for (let c of cookies) {
          const [k, ...rest] = c.trim().split('=');
          if (k === encoded) {
            return decodeURIComponent(rest.join('='));
          }
        }
        return null;
      },

      /** getAll() → { name: value, ... } */
      getAll() {
        if (!document.cookie) return {};
        return document.cookie.split(';').reduce((acc, c) => {
          const [k, ...rest] = c.trim().split('=');
          if (k) acc[decodeURIComponent(k)] = decodeURIComponent(rest.join('='));
          return acc;
        }, {});
      },

      /** delete(name) — set expiry to past */
      delete(name) {
        this.set(name, '', { expires: -1 });
      },

      /** has(name) */
      has(name) {
        return this.get(name) !== null;
      },
    };

    // ── UI: Cookie Manager ────────────────────────────────────────────
    function doSet() {
      const name  = document.getElementById('c-name').value.trim();
      const value = document.getElementById('c-value').value.trim();
      const days  = parseInt(document.getElementById('c-days').value) || 7;
      if (!name) return;
      const raw = CookieManager.set(name, value, { expires: days, path: '/' });
      document.getElementById('c-result').textContent = `Set: ${raw}`;
      refreshOutput();
    }

    function doGet() {
      const name = document.getElementById('c-get-name').value.trim();
      const val  = CookieManager.get(name);
      document.getElementById('c-result').textContent =
        val !== null ? `"${name}" = "${val}"` : `"${name}" not found`;
      document.getElementById('c-output').textContent = val ?? 'null';
    }

    function doHas() {
      const name = document.getElementById('c-get-name').value.trim();
      document.getElementById('c-result').textContent =
        `has("${name}") → ${CookieManager.has(name)}`;
    }

    function doDelete() {
      const name = document.getElementById('c-get-name').value.trim();
      if (!name) return;
      CookieManager.delete(name);
      document.getElementById('c-result').textContent = `Deleted: "${name}"`;
      refreshOutput();
    }

    function doGetAll() {
      refreshOutput();
    }

    function clearAllCookies() {
      const all = CookieManager.getAll();
      Object.keys(all).forEach(k => CookieManager.delete(k));
      document.getElementById('c-result').textContent = 'All cookies cleared.';
      refreshOutput();
    }

    function refreshOutput() {
      document.getElementById('c-output').textContent =
        JSON.stringify(CookieManager.getAll(), null, 2);
    }

    // ══════════════════════════════════════════════════════
    //  Session Tracker (Part B)
    // ══════════════════════════════════════════════════════
    function initSessionTracker() {
      const now       = new Date().toISOString();
      const visits    = parseInt(CookieManager.get('st_visits') || '0') + 1;
      const firstVisit= CookieManager.get('st_first') || now;
      const theme     = CookieManager.get('st_theme') || 'light';

      CookieManager.set('st_visits',  String(visits),  { expires: 30 });
      CookieManager.set('st_first',   firstVisit,       { expires: 30 });
      CookieManager.set('st_last',    now,              { expires: 30 });
      CookieManager.set('st_theme',   theme,            { expires: 30 });

      renderSession();
      refreshOutput();
    }

    function setTheme(theme) {
      CookieManager.set('st_theme', theme, { expires: 30 });
      document.getElementById('s-result').textContent = `Theme set to: "${theme}"`;
      renderSession();
      refreshOutput();
    }

    function renderSession() {
      const visits     = CookieManager.get('st_visits') || '1';
      const firstVisit = CookieManager.get('st_first');
      const lastVisit  = CookieManager.get('st_last');
      const theme      = CookieManager.get('st_theme') || 'light';

      const fmt = iso => iso ? new Date(iso).toLocaleString() : '—';

      const card = document.getElementById('session-card');
      card.innerHTML = '';

      const rows = [
        ['Visit count',  `#${visits}`],
        ['First visit',  fmt(firstVisit)],
        ['Last visit',   fmt(lastVisit)],
        ['Theme',        theme],
      ];

      rows.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'session-row';
        const l = document.createElement('span');
        l.className   = 'session-label';
        l.textContent = label;
        const v = document.createElement('span');
        v.className   = 'session-value';
        v.textContent = value;
        row.appendChild(l);
        row.appendChild(v);
        card.appendChild(row);
      });
    }

    initSessionTracker();
  </script>
</body>
</html>
