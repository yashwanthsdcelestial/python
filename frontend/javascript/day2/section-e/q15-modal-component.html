<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q15 — Accessible Modal Component</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 2rem; background: #f3f4f6; }
    h2 { margin-bottom: .4rem; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 1.5rem; }
    .demo-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 2rem; }
    .demo-btns button {
      padding: 9px 20px; border: none; border-radius: 8px;
      background: #2563eb; color: white; cursor: pointer; font-size: 14px;
    }
    .demo-btns button:hover { background: #1d4ed8; }
    .demo-btns button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

    /* ── Modal backdrop ────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .modal-backdrop.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Modal box ─────────────────────────────────────── */
    .modal-box {
      background: white; border-radius: 14px;
      padding: 1.75rem; width: 90%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      transform: translateY(16px) scale(0.98);
      transition: transform .22s ease, opacity .2s ease;
      opacity: 0;
      position: relative;
    }
    .modal-backdrop.visible .modal-box {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 1rem;
    }
    .modal-title { font-size: 18px; font-weight: 600; color: #111827; }
    .modal-close-btn {
      background: none; border: none; cursor: pointer; font-size: 20px;
      color: #9ca3af; padding: 0 4px; line-height: 1; border-radius: 4px;
      transition: color .15s;
    }
    .modal-close-btn:hover { color: #374151; }
    .modal-close-btn:focus-visible { outline: 2px solid #2563eb; }

    .modal-content { font-size: 15px; color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button {
      padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 14px;
      transition: background .15s;
    }
    .modal-actions button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .btn-cancel  { background: white; border: 1.5px solid #d1d5db; color: #374151; }
    .btn-cancel:hover  { background: #f9fafb; }
    .btn-confirm { background: #2563eb; border: none; color: white; }
    .btn-confirm:hover { background: #1d4ed8; }
    .btn-danger  { background: #dc2626; border: none; color: white; }
    .btn-danger:hover  { background: #b91c1c; }

    /* Stack indicator */
    .stack-info {
      position: fixed; bottom: 1rem; left: 1rem;
      background: #1f2937; color: #d4d4d4;
      font-size: 12px; font-family: monospace;
      padding: 8px 12px; border-radius: 6px;
      z-index: 9999;
    }

    /* Result log */
    #result-log {
      background: white; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 1rem; font-family: monospace; font-size: 13px;
      min-height: 60px; color: #374151;
    }
  </style>
</head>
<body>
  <h2>Q15 — Accessible Modal Component</h2>
  <p class="subtitle">Focus trap · ARIA · Escape key · Backdrop click · Stacking · Body scroll lock</p>

  <div class="demo-btns">
    <button id="btn-confirm" onclick="demoConfirm()">Confirm Dialog</button>
    <button id="btn-form"    onclick="demoForm()">Form Modal</button>
    <button id="btn-nested"  onclick="demoNested()">Nested Modals</button>
  </div>

  <div>
    <p style="font-size:13px;color:#6b7280;margin-bottom:.5rem">Action log:</p>
    <div id="result-log">Open a modal to see events here.</div>
  </div>

  <div class="stack-info" id="stack-info">Stack: 0</div>

  <script>
    // ══════════════════════════════════════════════════════
    //  Modal stack — supports stacking/nesting
    // ══════════════════════════════════════════════════════
    const modalStack = [];

    function updateStackInfo() {
      document.getElementById('stack-info').textContent = `Stack: ${modalStack.length}`;
    }

    function logAction(msg) {
      document.getElementById('result-log').textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    // ── Focusable elements query ────────────────────────────────────────
    const FOCUSABLE = [
      'a[href]', 'button:not([disabled])', 'input:not([disabled])',
      'select:not([disabled])', 'textarea:not([disabled])',
      '[tabindex]:not([tabindex="-1"])',
    ].join(', ');

    // ══════════════════════════════════════════════════════
    //  createModal({ title, content, onConfirm, onCancel, confirmLabel, confirmClass })
    //  Returns { open(), close(), destroy() }
    // ══════════════════════════════════════════════════════
    function createModal({ title, content, onConfirm, onCancel, confirmLabel = 'Confirm', confirmClass = 'btn-confirm', showCancel = true } = {}) {

      // Build DOM
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.setAttribute('role', 'presentation');

      const box = document.createElement('div');
      box.className = 'modal-box';
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      box.setAttribute('aria-labelledby', `modal-title-${Date.now()}`);

      const header = document.createElement('div');
      header.className = 'modal-header';

      const titleEl = document.createElement('h3');
      titleEl.className   = 'modal-title';
      titleEl.id          = box.getAttribute('aria-labelledby');
      titleEl.textContent = title;

      const closeBtn = document.createElement('button');
      closeBtn.className   = 'modal-close-btn';
      closeBtn.textContent = '×';
      closeBtn.setAttribute('aria-label', 'Close modal');

      header.appendChild(titleEl);
      header.appendChild(closeBtn);

      const contentEl = document.createElement('div');
      contentEl.className = 'modal-content';
      if (typeof content === 'string') {
        contentEl.textContent = content;
      } else {
        contentEl.appendChild(content);
      }

      const actions = document.createElement('div');
      actions.className = 'modal-actions';

      if (showCancel) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className   = 'btn-cancel';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => modal.close());
        actions.appendChild(cancelBtn);
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.className   = confirmClass;
      confirmBtn.textContent = confirmLabel;
      confirmBtn.addEventListener('click', () => {
        if (onConfirm) onConfirm();
        modal.close();
      });
      actions.appendChild(confirmBtn);

      box.appendChild(header);
      box.appendChild(contentEl);
      box.appendChild(actions);
      backdrop.appendChild(box);

      // ── Focus trap ────────────────────────────────────────
      function trapFocus(e) {
        const focusable = [...box.querySelectorAll(FOCUSABLE)];
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last  = focusable[focusable.length - 1];
        if (e.key === 'Tab') {
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
          }
        }
        if (e.key === 'Escape') modal.close();
      }

      let previousFocus = null;

      const modal = {
        open() {
          previousFocus = document.activeElement;
          document.body.appendChild(backdrop);
          // Prevent body scroll when any modal is open
          document.body.style.overflow = 'hidden';

          // Trigger animation on next frame
          requestAnimationFrame(() => backdrop.classList.add('visible'));

          modalStack.push(modal);
          updateStackInfo();

          // Focus first focusable element inside modal
          setTimeout(() => {
            const first = box.querySelector(FOCUSABLE);
            if (first) first.focus();
          }, 50);

          backdrop.addEventListener('click', e => {
            if (e.target === backdrop) modal.close();
          });
          document.addEventListener('keydown', trapFocus);
          logAction(`Opened: "${title}"`);
        },

        close() {
          backdrop.classList.remove('visible');

          setTimeout(() => {
            if (backdrop.parentNode) backdrop.remove();
            const idx = modalStack.indexOf(modal);
            if (idx > -1) modalStack.splice(idx, 1);

            // Only restore scroll if no other modals open
            if (modalStack.length === 0) document.body.style.overflow = '';

            updateStackInfo();
            if (previousFocus) previousFocus.focus();
            document.removeEventListener('keydown', trapFocus);
            if (onCancel && !modal._confirmed) onCancel();
            logAction(`Closed: "${title}"`);
          }, 220); // Match transition duration
        },

        destroy() {
          modal.close();
          setTimeout(() => backdrop.remove(), 300);
        },
      };

      closeBtn.addEventListener('click', () => modal.close());
      return modal;
    }

    // ══════════════════════════════════════════════════════
    //  Demo functions
    // ══════════════════════════════════════════════════════
    function demoConfirm() {
      const m = createModal({
        title:        'Delete Item',
        content:      'Are you sure you want to delete this item? This action cannot be undone.',
        confirmLabel: 'Delete',
        confirmClass: 'btn-danger',
        onConfirm:    () => logAction('Confirmed: item deleted!'),
        onCancel:     () => logAction('Cancelled: nothing deleted.'),
      });
      m.open();
    }

    function demoForm() {
      // Build a form inside the modal content
      const form = document.createElement('div');
      form.innerHTML = `
        <div style="margin-bottom:.75rem">
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Name</label>
          <input id="modal-name" type="text" style="width:100%;padding:8px 11px;border:1.5px solid #d1d5db;border-radius:7px;font-size:14px;outline:none" placeholder="Your name"/>
        </div>
        <div>
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Email</label>
          <input id="modal-email" type="email" style="width:100%;padding:8px 11px;border:1.5px solid #d1d5db;border-radius:7px;font-size:14px;outline:none" placeholder="you@example.com"/>
        </div>
      `;
      const m = createModal({
        title:        'Edit Profile',
        content:      form,
        confirmLabel: 'Save',
        onConfirm: () => {
          const name  = document.getElementById('modal-name')?.value;
          const email = document.getElementById('modal-email')?.value;
          logAction(`Saved: name="${name}" email="${email}"`);
        },
      });
      m.open();
    }

    function demoNested() {
      const m1 = createModal({
        title:        'First Modal',
        content:      'This is the first modal. Click Confirm to open a second modal on top.',
        confirmLabel: 'Open Second',
        onConfirm: () => {
          const m2 = createModal({
            title:        'Second Modal (Nested)',
            content:      'This is the second modal stacked on top. Escape closes only this one.',
            confirmLabel: 'Got it',
            onConfirm: () => logAction('Confirmed second modal'),
          });
          m2.open();
        },
      });
      m1.open();
    }
  </script>
</body>
</html>
