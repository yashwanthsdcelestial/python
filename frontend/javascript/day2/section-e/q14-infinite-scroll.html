<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q14 — Throttle + Infinite Scroll</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f3f4f6; padding: 1.5rem; }
    h2 { margin-bottom: .4rem; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 1.5rem; }

    .stats-bar {
      display: flex; gap: 1.5rem; font-size: 13px; color: #374151;
      background: white; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: .6rem 1rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .stats-bar span { display: flex; align-items: center; gap: 5px; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .badge.blue   { background: #dbeafe; color: #1e40af; }
    .badge.green  { background: #dcfce7; color: #166534; }
    .badge.yellow { background: #fef3c7; color: #92400e; }

    #post-list { max-width: 640px; }
    .post-card {
      background: white; border-radius: 10px; padding: 1rem 1.25rem;
      border: 1px solid #e5e7eb; margin-bottom: 10px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .post-num { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .post-title { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 5px; line-height: 1.4; }
    .post-body  { font-size: 13px; color: #6b7280; line-height: 1.6; }

    /* Loading sentinel area */
    #sentinel { height: 10px; }
    #loader {
      text-align: center; padding: 1.5rem; color: #6b7280; font-size: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .spin { width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .done-msg { text-align: center; padding: 1.5rem; color: #059669; font-weight: 600; font-size: 15px; }
    .retry-btn { padding: 7px 16px; background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 7px; cursor: pointer; font-size: 13px; margin-top: .5rem; }
    .retry-btn:hover { background: #fee2e2; }

    /* Debug log */
    .debug { max-width: 640px; margin-top: 1rem; background: #1e1e1e; color: #d4d4d4; padding: .75rem; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; }
    .dlog-throttle { color: #93c5fd; }
    .dlog-fetch    { color: #86efac; }
    .dlog-done     { color: #fde68a; }
    .dlog-err      { color: #fca5a5; }
  </style>
</head>
<body>
  <h2>Q14 — Throttle + Infinite Scroll</h2>
  <p class="subtitle">IntersectionObserver on sentinel · throttle() from scratch · 20 posts/batch · 100 total</p>

  <div class="stats-bar">
    <span>Loaded: <span class="badge blue" id="stat-loaded">0</span></span>
    <span>Total:  <span class="badge green" id="stat-total">100</span></span>
    <span>Batches:<span class="badge yellow" id="stat-batches">0</span></span>
    <span id="stat-time" style="margin-left:auto;color:#9ca3af"></span>
  </div>

  <div id="post-list"></div>
  <div id="loader"><div class="spin"></div><span>Loading…</span></div>
  <div id="sentinel"></div>
  <div class="debug" id="debug"></div>

  <script>
    // ══════════════════════════════════════════════════════
    //  throttle — implemented from scratch (no library)
    // ══════════════════════════════════════════════════════
    function throttle(fn, interval) {
      let lastCall = 0;
      let pending  = null;
      return function(...args) {
        const now = Date.now();
        const gap = now - lastCall;
        if (gap >= interval) {
          lastCall = now;
          fn.apply(this, args);
        } else {
          // Schedule a trailing call
          clearTimeout(pending);
          pending = setTimeout(() => {
            lastCall = Date.now();
            fn.apply(this, args);
          }, interval - gap);
        }
      };
    }

    // ══════════════════════════════════════════════════════
    //  State
    // ══════════════════════════════════════════════════════
    const LIMIT  = 20;
    const TOTAL  = 100;
    const BASE   = 'https://jsonplaceholder.typicode.com';

    let offset    = 0;
    let loading   = false;
    let allLoaded = false;
    let batches   = 0;
    let observer  = null;

    const list     = document.getElementById('post-list');
    const loaderEl = document.getElementById('loader');
    const sentinel = document.getElementById('sentinel');

    // ── Debug logger ──────────────────────────────────────
    function dlog(msg, cls = '') {
      const el  = document.getElementById('debug');
      const div = document.createElement('div');
      div.className   = cls;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    // ── Render posts ──────────────────────────────────────
    function renderPosts(posts) {
      const frag = document.createDocumentFragment();
      posts.forEach((post, i) => {
        const card = document.createElement('div');
        card.className = 'post-card';

        const num = document.createElement('div');
        num.className   = 'post-num';
        num.textContent = `Post #${offset - posts.length + i + 1}`;

        const title = document.createElement('div');
        title.className   = 'post-title';
        title.textContent = post.title;

        const body = document.createElement('div');
        body.className   = 'post-body';
        body.textContent = post.body;

        card.appendChild(num);
        card.appendChild(title);
        card.appendChild(body);
        frag.appendChild(card);
      });
      list.appendChild(frag);
    }

    // ── Show / hide loader ────────────────────────────────
    function showLoader(visible) {
      loaderEl.style.display = visible ? 'flex' : 'none';
    }

    function showError(msg) {
      loaderEl.innerHTML = `
        <span style="color:#dc2626">⚠ ${msg}</span>
        <button class="retry-btn" onclick="retryFetch()">↺ Retry</button>
      `;
      loaderEl.style.display = 'flex';
    }

    function retryFetch() {
      loading = false;
      showLoader(true);
      loaderEl.innerHTML = '<div class="spin"></div><span>Retrying…</span>';
      fetchBatch();
    }

    // ── Fetch one batch ───────────────────────────────────
    async function fetchBatch() {
      if (loading || allLoaded) return;
      loading = true;
      const t0 = performance.now();

      dlog(`Fetching batch: _start=${offset} _limit=${LIMIT}`, 'dlog-fetch');

      try {
        const res = await fetch(`${BASE}/posts?_start=${offset}&_limit=${LIMIT}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const posts = await res.json();

        offset  += posts.length;
        batches += 1;

        renderPosts(posts);

        document.getElementById('stat-loaded').textContent  = offset;
        document.getElementById('stat-batches').textContent = batches;
        document.getElementById('stat-time').textContent    = `Last batch: ${Math.round(performance.now() - t0)}ms`;

        dlog(`Rendered ${posts.length} posts (total ${offset}/${TOTAL})`, 'dlog-fetch');

        if (offset >= TOTAL || posts.length < LIMIT) {
          allLoaded = true;
          showLoader(false);
          loaderEl.remove();
          const done = document.createElement('div');
          done.className   = 'done-msg';
          done.textContent = `✓ All ${offset} posts loaded`;
          list.after(done);
          if (observer) observer.disconnect();
          dlog(`All posts loaded!`, 'dlog-done');
        } else {
          showLoader(false);
        }
      } catch (err) {
        dlog(`Error: ${err.message}`, 'dlog-err');
        showError(err.message);
      } finally {
        loading = false;
      }
    }

    // ── Throttled fetch trigger (fires at most every 500ms) ─
    const throttledFetch = throttle(() => {
      dlog('Throttled trigger fired', 'dlog-throttle');
      fetchBatch();
    }, 500);

    // ── IntersectionObserver on sentinel element ──────────
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !loading && !allLoaded) {
          dlog('Sentinel entered viewport', 'dlog-throttle');
          throttledFetch();
        }
      });
    }, { rootMargin: '200px' });

    observer.observe(sentinel);

    // ── Initial load ──────────────────────────────────────
    showLoader(true);
    fetchBatch();
  </script>
</body>
</html>
